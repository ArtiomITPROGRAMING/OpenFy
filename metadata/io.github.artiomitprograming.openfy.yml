AutoName: OpenFy
Summary: Modern offline music player with synced lyrics, DSP equalizer, and car mode
Description: |-
  OpenFy is a modern, privacy-focused, 100% offline-first music player
  crafted with Jetpack Compose and AndroidX Media3 (ExoPlayer).

  Features:
  * Pure offline-first architecture without accounts or tracking
  * Synced lyrics (.lrc) with auto-discovery and embedded tag extraction
  * 5-band hardware DSP Equalizer (Virtualizer, Bass Boost, Reverb)
  * High-contrast driving car mode with vector icons
  * Material You dynamic color extraction and pure OLED dark mode
  * Sleep timer, floating dock capsule, and gesture controls
  * Local offline P2P sharing via Wi-Fi and QR Code

