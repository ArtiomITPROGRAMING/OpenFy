name: OpenFy CI / Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Compute SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/release/
          sha256sum app-release.apk > app-release.apk.sha256
          echo "SHA-256 Hash:"
          cat app-release.apk.sha256

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfy-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 14

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## OpenFy ${{ github.ref_name }} Beta Release
            
            ### SHA-256 Checksum
            ```
            $(cat app/build/outputs/apk/release/app-release.apk.sha256)
            ```
            
            ### Key Highlights
            - 100% FOSS & Offline-First music playback (no tracking, zero telemetry).
            - Modern Jetpack Compose Material 3 UI with Material You dynamic themer.
            - P2P Local Share & QR Code Scanner for offline playlist and track exchange.
            - Real-time Synced Lyrics (.lrc) and embedded tag extractor.
            - 5-band Hardware DSP Equalizer with Bass Boost, Virtualizer, and Reverb.
            - Distraction-free Car Driving Mode and Sleep Timer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
